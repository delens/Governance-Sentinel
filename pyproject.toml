[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bias_audit", "data_loader", "main", "reporter", "validators"]

[tool.mypy]
python_version = "3.10"
files = [
    "main.py",
    "data_loader.py",
    "validators.py",
    "bias_audit.py",
    "reporter.py",
    "tests",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["aif360.*", "pandas"]
ignore_missing_imports = true
